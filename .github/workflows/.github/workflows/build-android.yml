name: Build WebView APK

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: 'URL website yang akan dibungkus'
        required: true
        type: string
      app_name:
        description: 'Nama aplikasi'
        required: false
        default: 'MyApp'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Create WebView Project
        run: |
          flutter create --org com.build --project-name mywebview webview_app
          cd webview_app
          flutter pub add webview_flutter
          cat > lib/main.dart << 'DART'
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';
          void main() => runApp(const MyApp());
          class MyApp extends StatelessWidget {
            const MyApp({super.key});
            Widget build(BuildContext context) => MaterialApp(
              title: '${{ github.event.inputs.app_name }}',
              home: Scaffold(
                body: WebViewWidget(
                  controller: WebViewController()
                    ..setJavaScriptMode(JavaScriptMode.unrestricted)
                    ..loadRequest(Uri.parse('${{ github.event.inputs.website_url }}')),
                ),
              ),
            );
          }
          DART

      - name: Build APK
        run: |
          cd webview_app
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: webview-apk
          path: webview_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1
